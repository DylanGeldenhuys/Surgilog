function decodeJwtPayload(token) {
  const parts = token.split(".");
  if (parts.length !== 3) return null;
  const b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
  try {
    return JSON.parse(atob(b64));

}

const makeDOB = (ageYears, dayOffset) => {

};

// Age is deliberately never stored — it's derived from DOB wherever it's
// shown, so it can't silently go stale the way a stored age field would as
// time passes. Same principle a real backend should follow: compute it in
// the query/API layer, don't persist it.
const ageFromDOB = (dobIso) => {
  const dob = new Date(dobIso);
  let age = TODAY.getFullYear() - dob.getFullYear();
  const hasHadBirthdayThisYear =
    TODAY.getMonth() > dob.getMonth() || (TODAY.getMonth() === dob.getMonth() && TODAY.getDate() >= dob.getDate());
  if (!hasHadBirthdayThisYear) age -= 1;
  return age;
};

const makePhone = (seed, i) => {
  const n = 1000000000 + ((seed * 7919 + i * 104729) % 899999999);
  const s = String(n);
  return `+${s.slice(0, 2)} ${s.slice(2, 5)} ${s.slice(5, 8)} ${s.slice(8)}`;
};

function makeCases(specialty, count, seed) {
  const cases = [];
  for (let i = 0; i < count; i++) {
    const r = (seed * 37 + i * 91) % 100;
    const urgency = r < 15 ? "P1" : r < 45 ? "P2" : "P3";
    const waitDays = urgency === "P1" ? 150 + (r % 100) : urgency === "P2" ? 80 + (r % 130) : 20 + (r % 100);
    const scheduled = r % 5 === 0;
    cases.push({
      id: `PT-${88000 + seed * 100 + i}`,
      patientName: PATIENT_NAME_POOL[(seed * 3 + i) % PATIENT_NAME_POOL.length],
      dob: makeDOB(20 + ((seed * 11 + i * 5) % 65), (seed + i) % 27),
      gender: GENDER_POOL[(seed + i * 2) % GENDER_POOL.length],
      phone: makePhone(seed, i),
      procedure: PROCEDURES[specialty][r % 3],
      surgeon: SURGEONS[specialty][r % 2],
      urgency,
      waitDays,
      waitlistDate: daysAgo(waitDays),
      status: scheduled ? "Scheduled" : "Waitlisted",
      scheduledDate: scheduled ? isoDate(daysAgo(-((r % 10) + 2))) : null,
    });
  }
  return cases;
}

}

const percentile = (arr, p) => {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  return s[Math.floor((s.length - 1) * p)];
};

function deptStats(dept) {
  if (dept.liveStats) return dept.liveStats; // real numbers from /backlog-summary, used when case-level rows are blocked or just to avoid recomputing client-side
  const waits = dept.cases.map((c) => c.waitDays);
  const overdue = dept.cases.filter((c) => c.urgency === "P1" && c.waitDays > 200).length;
  return {
    backlog: dept.cases.filter((c) => c.status === "Waitlisted").length,
    avgWait: Math.round(waits.reduce((a, b) => a + b, 0) / (waits.length || 1)),
    p90: percentile(waits, 0.9),
    overdue,
    trendDir: dept.trend[5].backlog - dept.trend[0].backlog,
  };
}

function statusOf(stats) {
  if (stats.overdue > 2 || stats.avgWait > 190) return "critical";
  if (stats.trendDir > 0) return "rising";
  return "improving";
}

function Overview({ hospitals: allHospitals, lockedLabel, onSelectHospital }) {
  const [region, setRegion] = useState(lockedLabel || "All regions");

  const hospitals = useMemo(
    () => allHospitals.filter((h) => (lockedLabel ? true : region === "All regions" || h.region === region)),
    [allHospitals, region, lockedLabel]
  );

  const allDepts = useMemo(() => hospitals.flatMap((h) => h.departments.map((d) => ({ ...d, hospital: h }))), [hospitals]);
  const allCases = useMemo(() => allDepts.flatMap((d) => d.cases), [allDepts]);

  const totalBacklog = allCases.filter((c) => c.status === "Waitlisted").length;
  const avgWait = Math.round(allCases.reduce((a, c) => a + c.waitDays, 0) / (allCases.length || 1));
  const p90 = percentile(allCases.map((c) => c.waitDays), 0.9);
  const completed = Math.round(totalBacklog * 0.14);
  const overdue = allCases.filter((c) => c.urgency === "P1" && c.waitDays > 200).length;

  const bySpecialty = useMemo(() => {
    const m = {};
    allDepts.forEach((d) => {
      const key = d.name;
      m[key] = (m[key] || 0) + d.cases.filter((c) => c.status === "Waitlisted").length;
    });
    return Object.entries(m).map(([name, backlog]) => ({ name, backlog }));
  }, [allDepts]);

  const alerts = useMemo(() => {
    return allDepts
      .map((d) => ({ d, stats: deptStats(d) }))
      .filter(({ stats }) => stats.overdue > 0)
      .sort((a, b) => b.stats.overdue - a.stats.overdue)
      .slice(0, 4);
  }, [allDepts]);

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <div className="flex items-center gap-3">

const SORT_ACCESSORS = {
  id: (c) => c.id,
  patientName: (c) => c.patientName,
  deptName: (c) => c.deptName,
  procedure: (c) => c.procedure,
  surgeon: (c) => c.surgeon,
  urgency: (c) => URGENCY_RANK[c.urgency],
  waitDays: (c) => c.waitDays,
  status: (c) => c.status,
};

function SortHeader({ label, sortKey, active, dir, onClick }) {
  return (
    <th
      onClick={() => onClick(sortKey)}
      className="text-left text-xs font-normal px-3 py-2 select-none cursor-pointer"
      style={{ color: active ? C.text : C.textDim, borderBottom: `1px solid ${C.border}`, fontFamily: "Inter" }}
    >
      <span className="inline-flex items-center gap-1">
        {label}
        {active ? (dir === "asc" ? <ArrowUp size={11} /> : <ArrowDown size={11} />) : <ArrowUpDown size={11} color={C.textFaint} />}
      </span>
    </th>
  );
}

function HospitalView({ hospital, onBack, onSelectDept, canViewCaseLevel }) {
  const [sortKey, setSortKey] = useState("waitDays");
  const [sortDir, setSortDir] = useState("desc");

  const residency = hospital.residency;
  const blocked = residency?.required && !canViewCaseLevel;
  const policy = residency ? RESIDENCY_POLICIES[residency.jurisdiction] : null;

  const allCases = useMemo(
    () => hospital.departments.flatMap((d) => d.cases.map((c) => ({ ...c, deptId: d.id, deptName: d.name }))),
    [hospital]
  );

  const sorted = useMemo(() => {
    const accessor = SORT_ACCESSORS[sortKey];
    const arr = [...allCases].sort((a, b) => {
      const av = accessor(a), bv = accessor(b);
      if (typeof av === "string") return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === "asc" ? av - bv : bv - av;
    });
    return arr;
  }, [allCases, sortKey, sortDir]);

  const toggleSort = (key) => {
    if (key === sortKey) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("desc"); }
  };

  return (
    <div>
      {onBack && (
        <button onClick={onBack} className="flex items-center gap-1 text-xs mb-4" style={{ color: C.textDim, fontFamily: "Inter", background: "none", border: "none", cursor: "pointer" }}>
          <ArrowLeft size={14} /> All hospitals
        </button>
      )}
      <div className="flex items-center gap-2 mb-1">
        <h1 style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 20, color: C.text }}>{hospital.name}</h1>
        {residency && (
          <span className="inline-flex items-center gap-1" title={`${policy?.law} — ${policy?.fullName}`}>
            <Shield size={13} color={C.textFaint} />
          </span>
        )}
      </div>
      <div className="text-xs mb-5" style={{ color: C.textFaint, fontFamily: "Inter" }}>
        {hospital.country}{residency && ` · data residency: ${policy?.law}`}
      </div>

      <div className="grid gap-3 mb-6" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))" }}>
        {hospital.departments.map((d) => {
          const stats = deptStats(d);
          const st = STATUS_STYLE[statusOf(stats)];
          return (
            <div
              key={d.id}
              onClick={() => !blocked && onSelectDept(d.id)}
              className="rounded-xl p-4 transition-transform"
              style={{ background: C.surface, border: `1px solid ${C.border}`, cursor: blocked ? "default" : "pointer" }}
              onMouseEnter={(e) => { if (!blocked) e.currentTarget.style.borderColor = C.accent; }}
              onMouseLeave={(e) => (e.currentTarget.style.borderColor = C.border)}
            >
              <div className="flex items-center justify-between mb-3">
                <div className="text-sm font-medium" style={{ color: C.text, fontFamily: "Inter" }}>{d.name}</div>
                <Pill bg={st.bg} fg={st.fg}>{st.label}</Pill>
              </div>
              <div className="flex gap-4">
                <div>
                  <div className="text-lg" style={{ color: C.text, fontFamily: "'IBM Plex Mono'", fontWeight: 600 }}>{stats.backlog}</div>
                  <div className="text-xs" style={{ color: C.textFaint, fontFamily: "Inter" }}>backlog</div>
                </div>
                <div>
                  <div className="text-lg" style={{ color: C.text, fontFamily: "'IBM Plex Mono'", fontWeight: 600 }}>{stats.avgWait}d</div>
                  <div className="text-xs" style={{ color: C.textFaint, fontFamily: "Inter" }}>avg wait</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {blocked ? (
        <div className="rounded-xl p-4 flex gap-3" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <LockIcon size={16} color={C.textFaint} style={{ flexShrink: 0, marginTop: 2 }} />
          <div>
            <div className="text-sm mb-1" style={{ color: C.text, fontFamily: "Inter", fontWeight: 500 }}>
              Case-level records are not shown outside {residency.jurisdiction}
            </div>
            <div className="text-xs" style={{ color: C.textDim, fontFamily: "Inter", lineHeight: 1.5 }}>
              {policy?.note} Only the aggregated department stats above are shown to your role.
            </div>
          </div>
        </div>
      ) : (
        <div>
          <div className="text-xs mb-2" style={{ color: C.textDim, fontFamily: "Inter" }}>
            All cases · click a column to sort, click a row to open its department
          </div>
          <div className="rounded-xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
            <table className="w-full" style={{ borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  <SortHeader label="Patient ref" sortKey="id" active={sortKey === "id"} dir={sortDir} onClick={toggleSort} />
                  <SortHeader label="Patient" sortKey="patientName" active={sortKey === "patientName"} dir={sortDir} onClick={toggleSort} />
                  <th className="text-left text-xs font-normal px-3 py-2" style={{ color: C.textDim, borderBottom: `1px solid ${C.border}`, fontFamily: "Inter" }}>DOB (age)</th>
                  <th className="text-left text-xs font-normal px-3 py-2" style={{ color: C.textDim, borderBottom: `1px solid ${C.border}`, fontFamily: "Inter" }}>Gender</th>
                  <th className="text-left text-xs font-normal px-3 py-2" style={{ color: C.textDim, borderBottom: `1px solid ${C.border}`, fontFamily: "Inter" }}>Contact</th>
                  <SortHeader label="Department" sortKey="deptName" active={sortKey === "deptName"} dir={sortDir} onClick={toggleSort} />
                  <SortHeader label="Procedure" sortKey="procedure" active={sortKey === "procedure"} dir={sortDir} onClick={toggleSort} />
                  <SortHeader label="Surgeon" sortKey="surgeon" active={sortKey === "surgeon"} dir={sortDir} onClick={toggleSort} />
                  <SortHeader label="Urgency" sortKey="urgency" active={sortKey === "urgency"} dir={sortDir} onClick={toggleSort} />
                  <SortHeader label="Wait" sortKey="waitDays" active={sortKey === "waitDays"} dir={sortDir} onClick={toggleSort} />
                  <SortHeader label="Status" sortKey="status" active={sortKey === "status"} dir={sortDir} onClick={toggleSort} />
                </tr>
              </thead>
              <tbody>
                {sorted.map((c) => (
                  <tr
                    key={`${c.deptId}-${c.id}`}
                    onClick={() => onSelectDept(c.deptId)}
                    className="cursor-pointer transition-colors"
                    style={{ borderBottom: `1px solid ${C.border}` }}
                    onMouseEnter={(e) => (e.currentTarget.style.background = C.surface2)}
                    onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}
                  >
                    <td className="px-3 py-2 text-sm" style={{ color: C.text, fontFamily: "'IBM Plex Mono'" }}>{c.id}</td>
                    <td className="px-3 py-2 text-sm" style={{ color: C.text, fontFamily: "Inter" }}>{c.patientName}</td>
                    <td className="px-3 py-2 text-sm" style={{ color: C.textDim, fontFamily: "'IBM Plex Mono'" }}>{fmtFullDate(new Date(c.dob))} ({ageFromDOB(c.dob)})</td>
                    <td className="px-3 py-2 text-sm" style={{ color: C.textDim, fontFamily: "Inter" }}>{c.gender}</td>
                    <td className="px-3 py-2 text-sm" style={{ color: C.textDim, fontFamily: "'IBM Plex Mono'" }}>{c.phone}</td>
                    <td className="px-3 py-2 text-sm" style={{ color: C.text, fontFamily: "Inter" }}>{c.deptName}</td>
                    <td className="px-3 py-2 text-sm" style={{ color: C.text, fontFamily: "Inter" }}>{c.procedure}</td>
                    <td className="px-3 py-2 text-sm" style={{ color: C.text, fontFamily: "Inter" }}>{c.surgeon}</td>
                    <td className="px-3 py-2"><Pill bg={URGENCY_STYLE[c.urgency].bg} fg={URGENCY_STYLE[c.urgency].fg}>{c.urgency}</Pill></td>
                    <td className="px-3 py-2 text-sm" style={{ color: c.waitDays > 200 ? C.danger : C.text, fontFamily: "'IBM Plex Mono'" }}>{c.waitDays}d</td>
                    <td className="px-3 py-2 text-sm" style={{ color: C.textDim, fontFamily: "Inter" }}>{c.status}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function EditCaseModal({ caseData, surgeons, canEditUrgency, canEditSchedule, onSave, onClose }) {
  const [urgency, setUrgency] = useState(caseData.urgency);
  const [gender, setGender] = useState(caseData.gender);
  const [surgeon, setSurgeon] = useState(caseData.surgeon);
  const [status, setStatus] = useState(caseData.status);
  const [scheduledDate, setScheduledDate] = useState(caseData.scheduledDate || isoDate(daysAgo(-7)));
  const [confirming, setConfirming] = useState(false);
  const [reason, setReason] = useState("");

  const isDowngrade = canEditUrgency && URGENCY_RANK[urgency] > URGENCY_RANK[caseData.urgency];

  const buildPatch = (extra = {}) => ({
    urgency,
    gender,
    surgeon,
    status,
    scheduledDate: status === "Scheduled" ? scheduledDate : null,
    ...extra,
  });

  const handleSaveClick = () => {
    if (isDowngrade) {
      setConfirming(true);
    } else {
      onSave(buildPatch());
    }
  };

  if (confirming) {
    return (
      <div
        className="fixed inset-0 flex items-center justify-center z-50 px-4"
        style={{ background: "rgba(6,10,20,0.65)" }}

          className="rounded-xl p-5 w-full"

            <strong style={{ color: C.text }}>{caseData.urgency}</strong> to{" "}

          <Field label="Clinical reason for downgrade (required)">

              value={reason}
              onChange={(e) => setReason(e.target.value)}

              Confirm downgrade

          </div>
        </div>
      </div>

          <div className="text-sm font-medium" style={{ color: C.text, fontFamily: "Inter" }}>

function DepartmentView({ hospital, dept, onBackHospital, onUpdateCase, readOnly, perms }) {
  const [urgency, setUrgency] = useState("All");
  const [surgeon, setSurgeon] = useState("All");
  const [editingId, setEditingId] = useState(null);
  const [sortKey, setSortKey] = useState("waitDays");
  const [sortDir, setSortDir] = useState("desc");
  const [draggedId, setDraggedId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);
  const [pendingDrag, setPendingDrag] = useState(null); // { caseData, newUrgency }

  const stats = deptStats(dept);
  const st = STATUS_STYLE[statusOf(stats)];
  const surgeons = Array.from(new Set(dept.cases.map((c) => c.surgeon)));

  const canDrag = perms.editUrgency && !readOnly && sortKey === "waitDays";

  const toggleSort = (key) => {
    if (key === sortKey) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("desc"); }
  };

  const filtered = dept.cases
    .filter((c) => urgency === "All" || c.urgency === urgency)
    .filter((c) => surgeon === "All" || c.surgeon === surgeon)
    .sort((a, b) => {
      const accessor = SORT_ACCESSORS[sortKey];
      const av = accessor(a), bv = accessor(b);
      if (typeof av === "string") return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === "asc" ? av - bv : bv - av;
    });

  const applyPriorityMove = (sourceCase, newUrgency, reason) => {
    onUpdateCase(dept.id, sourceCase.id, {
      urgency: newUrgency,
      ...(reason ? { downgradeReason: reason } : {}),
    });
  };

  const handleDrop = (targetCase) => {
    const sourceCase = filtered.find((c) => c.id === draggedId);
    setDraggedId(null);
    setDragOverId(null);
    if (!sourceCase || sourceCase.id === targetCase.id) return;

    const newUrgency = targetCase.urgency;
    if (newUrgency === sourceCase.urgency) return; // same band, no priority change

    if (URGENCY_RANK[newUrgency] > URGENCY_RANK[sourceCase.urgency]) {
      setPendingDrag({ caseData: sourceCase, newUrgency });
    } else {
      applyPriorityMove(sourceCase, newUrgency, null);
    }
  };

  return (
    <div>
      <div className="flex items-center gap-1 text-xs mb-2" style={{ color: C.textFaint, fontFamily: "Inter" }}>
        {onBackHospital ? (
          <button onClick={onBackHospital} style={{ background: "none", border: "none", color: C.textDim, cursor: "pointer", padding: 0, fontFamily: "Inter" }}>{hospital.name}</button>
        ) : (
          <span>{hospital.name}</span>
        )}
        <ChevronRight size={12} />
        <span>{dept.name}</span>
      </div>
      <div className="flex items-center justify-between mb-5">
        <h1 style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 20, color: C.text }}>{dept.name}</h1>
        <div className="flex items-center gap-2">
          {readOnly && <Pill bg={C.surface2} fg={C.textDim}>View only</Pill>}
          <Pill bg={st.bg} fg={st.fg}>{st.label}</Pill>
        </div>
      </div>

      <div className="grid gap-3 mb-6" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))" }}>
        <MetricCard label="Backlog" value={stats.backlog} />
        <MetricCard label="Avg wait" value={`${stats.avgWait}d`} />
        <MetricCard label="OR utilization" value={dept.orUtil == null ? "—" : `${dept.orUtil}%`} />
        <MetricCard label="Next OR slot" value={fmtDate(daysAgo(-6))} mono={false} />
      </div>

      <div className="mb-6">
        <div className="text-xs mb-2" style={{ color: C.textDim, fontFamily: "Inter" }}>Backlog trend, last 6 months</div>
        <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.border}`, height: 160 }}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={dept.trend} margin={{ top: 4, right: 8, left: -20, bottom: 0 }}>
              <CartesianGrid vertical={false} stroke={C.border} />
              <XAxis dataKey="month" tick={{ fill: C.textDim, fontSize: 11, fontFamily: "Inter" }} axisLine={{ stroke: C.border }} tickLine={false} />
              <YAxis tick={{ fill: C.textDim, fontSize: 11, fontFamily: "Inter" }} axisLine={false} tickLine={false} />
              <Tooltip contentStyle={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 12, fontFamily: "Inter" }} labelStyle={{ color: C.text }} />
              <Line type="monotone" dataKey="backlog" stroke={stats.trendDir > 0 ? C.danger : C.good} strokeWidth={2} dot={{ r: 3 }} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="flex items-center justify-between mb-2">
        <div>
          <div className="text-xs" style={{ color: C.textDim, fontFamily: "Inter" }}>Case queue</div>
          {perms.editUrgency && (
            <div className="text-xs mt-0.5" style={{ color: C.textFaint, fontFamily: "Inter" }}>
              {canDrag ? "Drag a case onto another to change its priority tier" : "Sort by Wait to enable drag-to-reprioritize"}
            </div>
          )}
        </div>
        <div className="flex gap-2">
          <select value={urgency} onChange={(e) => setUrgency(e.target.value)} className="text-xs px-2 py-1 rounded-lg" style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}`, fontFamily: "Inter" }}>

            <option>All</option>

      <div className="rounded-xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <table className="w-full" style={{ borderCollapse: "collapse" }}>
          <thead>
            <tr>
              {perms.editUrgency && <th className="px-2 py-2" style={{ borderBottom: `1px solid ${C.border}` }}></th>}
              <SortHeader label="Patient ref" sortKey="id" active={sortKey === "id"} dir={sortDir} onClick={toggleSort} />
              <SortHeader label="Patient" sortKey="patientName" active={sortKey === "patientName"} dir={sortDir} onClick={toggleSort} />
              <th className="text-left text-xs font-normal px-3 py-2" style={{ color: C.textDim, borderBottom: `1px solid ${C.border}`, fontFamily: "Inter" }}>DOB (age)</th>
              <th className="text-left text-xs font-normal px-3 py-2" style={{ color: C.textDim, borderBottom: `1px solid ${C.border}`, fontFamily: "Inter" }}>Gender</th>
              <th className="text-left text-xs font-normal px-3 py-2" style={{ color: C.textDim, borderBottom: `1px solid ${C.border}`, fontFamily: "Inter" }}>Contact</th>
              <SortHeader label="Procedure" sortKey="procedure" active={sortKey === "procedure"} dir={sortDir} onClick={toggleSort} />
              <SortHeader label="Surgeon" sortKey="surgeon" active={sortKey === "surgeon"} dir={sortDir} onClick={toggleSort} />
              <SortHeader label="Urgency" sortKey="urgency" active={sortKey === "urgency"} dir={sortDir} onClick={toggleSort} />
              <SortHeader label="Wait" sortKey="waitDays" active={sortKey === "waitDays"} dir={sortDir} onClick={toggleSort} />
              <SortHeader label="Status" sortKey="status" active={sortKey === "status"} dir={sortDir} onClick={toggleSort} />
              {!readOnly && <th className="px-3 py-2" style={{ borderBottom: `1px solid ${C.border}` }}></th>}
            </tr>
          </thead>
          <tbody>
            {filtered.map((c) => (
              <tr
                key={c.id}
                draggable={canDrag}
                onDragStart={() => setDraggedId(c.id)}
                onDragOver={(e) => { if (canDrag) { e.preventDefault(); setDragOverId(c.id); } }}
                onDragLeave={() => setDragOverId((id) => (id === c.id ? null : id))}
                onDrop={(e) => { e.preventDefault(); handleDrop(c); }}
                onDragEnd={() => { setDraggedId(null); setDragOverId(null); }}
                style={{

                  background: dragOverId === c.id && draggedId && draggedId !== c.id ? C.accentDim : "transparent",

              >
                {perms.editUrgency && (

                <td className="px-3 py-2 text-sm" style={{ color: C.text, fontFamily: "Inter" }}>{c.procedure}</td>
                <td className="px-3 py-2 text-sm" style={{ color: C.text, fontFamily: "Inter" }}>{c.surgeon}</td>
                <td className="px-3 py-2"><Pill bg={URGENCY_STYLE[c.urgency].bg} fg={URGENCY_STYLE[c.urgency].fg}>{c.urgency}</Pill></td>
                <td className="px-3 py-2 text-sm" style={{ color: c.waitDays > 200 ? C.danger : C.text, fontFamily: "'IBM Plex Mono'" }}>{c.waitDays}d</td>
                <td className="px-3 py-2 text-sm" style={{ color: C.textDim, fontFamily: "Inter" }}>{c.status === "Scheduled" ? `Scheduled ${fmtDate(new Date(c.scheduledDate))}` : c.status}</td>

                  <td className="px-3 py-2 text-right">
                    <button
                      onClick={() => setEditingId(c.id)}

                      style={{ background: "none", border: "none", cursor: "pointer", padding: 4, borderRadius: 6 }}
                      onMouseEnter={(e) => (e.currentTarget.style.background = C.surface2)}
                      onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}
                    >
                      <Pencil size={14} color={C.textDim} />
                    </button>

            {filtered.length === 0 && (
              <tr><td colSpan={10 + (perms.editUrgency ? 1 : 0) + (!readOnly ? 1 : 0)} className="px-3 py-6 text-center text-sm" style={{ color: C.textFaint, fontFamily: "Inter" }}>No cases match these filters.</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {editingId && !readOnly && (
        <EditCaseModal
          caseData={dept.cases.find((c) => c.id === editingId)}
          surgeons={surgeons}
          canEditUrgency={perms.editUrgency}

      {pendingDrag && (

const CSV_HEADER = ["department", "patient_ref", "patient_name", "patient_dob", "patient_gender", "patient_phone", "procedure", "surgeon", "urgency", "waitlist_date", "status"];
const VALID_URGENCY = ["P1", "P2", "P3"];
const VALID_STATUS = ["Waitlisted", "Scheduled", "Completed", "Cancelled"];
const VALID_GENDER = ["Female", "Male"];

const SAMPLE_CSV = `department,patient_ref,patient_name,patient_dob,patient_gender,patient_phone,procedure,surgeon,urgency,waitlist_date,status
Cardiac surgery,PT-90001,Karabo Sithole,1971-03-12,Male,+27 82 555 0101,CABG,Dr Novak,P1,2026-02-14,Waitlisted
Cardiac surgery,PT-90002,Elena Marchetti,1985-07-30,Female,+27 83 555 0102,Valve repair,Dr Adeyemi,P2,2026-04-02,Waitlisted
Orthopedics,PT-90003,Dumisani Khumalo,1960-11-05,Male,+27 84 555 0103,Total knee replacement,Dr Botha,P3,2026-06-10,Scheduled
Cardiac surgery,,Anna Petrova,1978-01-20,Female,+27 82 555 0104,CABG,Dr Novak,P1,2026-03-01,Waitlisted
General surgery,PT-90005,Farai Chikanga,1993-09-14,Female,+27 83 555 0105,Hernia repair,Dr Osei,P4,2026-05-11,Waitlisted
Orthopedics,PT-90006,Lindiwe Mahlangu,1988-04-22,Female,+27 84 555 0106,Hip replacement,Dr Lindqvist,P2,11-05-2026,Waitlisted
Orthopedics,PT-90007,Sipho Ndlovu,,Male,+27 84 555 0107,ACL reconstruction,Dr Botha,P3,2026-05-20,Waitlisted
General surgery,PT-90008,Zanele Mbeki,1990-06-18,Unspecified,+27 83 555 0108,Cholecystectomy,Dr Marchetti,P2,2026-04-28,Waitlisted`;

function parseCsv(text, hospital, restrictedDeptId) {
  const lines = text.trim().split("\n").filter((l) => l.trim().length > 0);
  if (lines.length < 2) return { valid: [], errors: [{ row: 0, reason: "No data rows found", raw: "" }] };

  const header = lines[0].split(",").map((s) => s.trim().toLowerCase());
  if (header.join(",") !== CSV_HEADER.join(",")) {
    return { valid: [], errors: [{ row: 1, reason: `Header must be: ${CSV_HEADER.join(", ")}`, raw: lines[0] }] };
  }

  const valid = [];
  const errors = [];

  lines.slice(1).forEach((line, i) => {
    const rowNum = i + 2;
    const fields = line.split(",").map((s) => s.trim());
    if (fields.length !== CSV_HEADER.length) {
      errors.push({ row: rowNum, reason: `Expected ${CSV_HEADER.length} columns, found ${fields.length}`, raw: line });
      return;
    }
    const [departmentName, patientRef, patientName, patientDobStr, patientGender, patientPhone, procedure, surgeon, urgency, waitlistDateStr, status] = fields;

    const dept = hospital.departments.find((d) => d.name.toLowerCase() === departmentName.toLowerCase());
    if (!dept) {
      errors.push({ row: rowNum, reason: `Unknown department "${departmentName}"`, raw: line });
      return;
    }
    if (restrictedDeptId && dept.id !== restrictedDeptId) {
      errors.push({ row: rowNum, reason: `Outside your department scope`, raw: line });
      return;
    }
    if (!patientRef) {
      errors.push({ row: rowNum, reason: "Missing patient reference", raw: line });
      return;
    }
    if (!patientName) {
      errors.push({ row: rowNum, reason: "Missing patient name", raw: line });
      return;
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(patientDobStr) || isNaN(new Date(patientDobStr).getTime()) || new Date(patientDobStr) > TODAY) {
      errors.push({ row: rowNum, reason: `Invalid date of birth "${patientDobStr}" (expected YYYY-MM-DD, not in the future)`, raw: line });
      return;
    }
    if (!VALID_GENDER.includes(patientGender)) {
      errors.push({ row: rowNum, reason: `Invalid gender "${patientGender}" (expected ${VALID_GENDER.join(", ")})`, raw: line });
      return;
    }
    if (!patientPhone) {
      errors.push({ row: rowNum, reason: "Missing patient contact number", raw: line });
      return;
    }
    if (!procedure || !surgeon) {
      errors.push({ row: rowNum, reason: "Missing procedure or surgeon", raw: line });
      return;
    }
    if (!VALID_URGENCY.includes(urgency)) {
      errors.push({ row: rowNum, reason: `Invalid urgency tier "${urgency}" (expected P1, P2 or P3)`, raw: line });
      return;
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(waitlistDateStr) || isNaN(new Date(waitlistDateStr).getTime())) {
      errors.push({ row: rowNum, reason: `Invalid date "${waitlistDateStr}" (expected YYYY-MM-DD)`, raw: line });
      return;
    }
    if (!VALID_STATUS.includes(status)) {
      errors.push({ row: rowNum, reason: `Invalid status "${status}"`, raw: line });
      return;
    }

    const waitlistDate = new Date(waitlistDateStr);
    const waitDays = Math.max(0, Math.round((TODAY - waitlistDate) / 86400000));

    valid.push({
      row: rowNum,
      deptId: dept.id,
      deptName: dept.name,
      caseData: {
        id: patientRef,
        patientName,
        dob: patientDobStr,
        gender: patientGender,
        phone: patientPhone,
        procedure,
        surgeon,
        urgency,
        waitDays,
        waitlistDate,
        status,
        scheduledDate: status === "Scheduled" ? isoDate(daysAgo(-7)) : null,
      },
    });
  });

  return { valid, errors };
}

const ROLES = [
  { id: "global_viewer", label: "Global viewer", level: "global", permissions: { editSchedule: false, editUrgency: false, manageUsers: false }, desc: "All hospitals, aggregated, read-only" },
  { id: "regional_viewer", label: "Regional viewer", level: "region", permissions: { editSchedule: false, editUrgency: false, manageUsers: false }, desc: "One region, aggregated, read-only" },
  { id: "country_viewer", label: "Country viewer", level: "country", permissions: { editSchedule: false, editUrgency: false, manageUsers: false }, desc: "One country, aggregated, read-only" },
  { id: "state_viewer", label: "State/Province viewer", level: "state", permissions: { editSchedule: false, editUrgency: false, manageUsers: false }, desc: "One state or province, aggregated, read-only" },
  { id: "district_viewer", label: "District viewer", level: "district", permissions: { editSchedule: false, editUrgency: false, manageUsers: false }, desc: "One district, aggregated, read-only" },
  { id: "hospital_admin", label: "Hospital admin", level: "hospital", permissions: { editSchedule: true, editUrgency: true, manageUsers: true }, desc: "One hospital, full case and urgency edit, manages users" },
  { id: "scheduler", label: "Scheduler", level: "hospital", permissions: { editSchedule: true, editUrgency: false, manageUsers: false }, desc: "One hospital, can reschedule cases — not urgency" },
  { id: "dept_head", label: "Department head", level: "department", permissions: { editSchedule: true, editUrgency: true, manageUsers: false }, desc: "One department, full clinical edit" },
];

function accountToSession(account) {
  const roleDef = ROLES.find((r) => r.id === account.role);
  const depth = LEVELS.indexOf(roleDef.level);
  return {
    role: account.role,
    region: depth >= 1 ? account.region : null,
    country: depth >= 2 ? account.country : null,
    state: depth >= 3 ? account.state : null,
    district: depth >= 4 ? account.district : null,
    hospitalId: depth >= 5 ? account.hospitalId : null,
    deptId: depth >= 6 ? account.deptId : null,
  };
}

function LoginScreen({ usersByHospital, onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [showDemo, setShowDemo] = useState(false);
  const [useLive, setUseLive] = useState(false);
  const [loading, setLoading] = useState(false);

  const allAccounts = [...AGGREGATE_ACCOUNTS, ...Object.values(usersByHospital).flat()];

  const submit = async () => {
    setError("");

    if (useLive) {
      setLoading(true);
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email.trim(), password }),
        });
        const data = await res.json();
        if (!res.ok) {
          setError(data.error || "Login failed.");
          setLoading(false);
          return;
        }
        const claims = decodeJwtPayload(data.token);
        onLogin({
          live: true,
          token: data.token,
          userId: claims.sub,
          role: claims.role,
          region: null, country: null, state: null, district: null, // see header note: live mode doesn't resolve these ids to names client-side
          hospitalId: claims.hospital_id || null,
          deptId: claims.department_id || null,
        });
      } catch {
        setError(`Could not reach the live backend at ${API_BASE}. Is "node server.js" running on your machine?`);
      }
      setLoading(false);
      return;
    }

    const normalizedEmail = email.trim().toLowerCase();
    const account = allAccounts.find((a) => a.email.toLowerCase() === normalizedEmail);
    if (!account || account.password !== password) {
      setError("Incorrect email or password.");
      return;
    }
    onLogin(accountToSession(account));
  };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <style>{FONTS}</style>
      <div className="w-full px-4" style={{ maxWidth: 360 }}>
        <div className="flex items-center gap-2 mb-6 justify-center">
          <Activity size={20} color={C.accent} />
          <span style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 18, color: C.text }}>
            Surgical Backlog
          </span>
        </div>

        <div className="rounded-xl p-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <div className="flex flex-col gap-3">
            <Field label="Email">
              <input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && submit()}
                placeholder="you@hospital.example"
                style={selectStyle}
                autoComplete="username"
              />
            </Field>
            <Field label="Password">
              <input
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && submit()}
                placeholder="••••••••"
                style={selectStyle}
                autoComplete="current-password"
              />
            </Field>
          </div>

          {error && (
            <div className="text-xs mt-3" style={{ color: C.danger, fontFamily: "Inter" }}>{error}</div>
          )}

          <button
            onClick={submit}
            disabled={!email.trim() || !password || loading}
            className="w-full text-sm py-2 rounded-lg mt-4"
            style={{
              background: email.trim() && password && !loading ? C.accent : C.surface2,
              color: email.trim() && password && !loading ? "#06231F" : C.textFaint,
              fontFamily: "Inter", fontWeight: 600, border: "none",
              cursor: email.trim() && password && !loading ? "pointer" : "not-allowed",
            }}
          >
            {loading ? "Signing in…" : "Sign in"}
          </button>

          <label className="flex items-center gap-2 mt-4 text-xs" style={{ color: C.textDim, fontFamily: "Inter", cursor: "pointer" }}>
            <input type="checkbox" checked={useLive} onChange={(e) => setUseLive(e.target.checked)} />
            Use live backend (requires <span style={{ fontFamily: "'IBM Plex Mono'" }}>node server.js</span> running locally)
          </label>

          <button
            onClick={() => setShowDemo((v) => !v)}
            className="w-full text-xs mt-3 text-center"
            style={{ background: "none", border: "none", color: C.textFaint, fontFamily: "Inter", cursor: "pointer" }}
          >
            {showDemo ? "Hide demo accounts" : "This is a prototype — show demo accounts"}
          </button>

          {showDemo && (
            <div className="mt-2 rounded-lg p-3" style={{ background: C.surface2, maxHeight: 180, overflowY: "auto" }}>
              <div className="text-xs mb-2" style={{ color: C.textFaint, fontFamily: "Inter" }}>
                Password for all demo accounts: <span style={{ fontFamily: "'IBM Plex Mono'", color: C.textDim }}>{DEMO_PASSWORD}</span>
                {useLive && " (same accounts are seeded server-side too)"}

              {allAccounts.map((a) => (

  );

function App() {
  const [session, setSession] = useState(null);
  const [restoringSession, setRestoringSession] = useState(true);
  const [hospitals, setHospitals] = useState(HOSPITALS);
  const [usersByHospital, setUsersByHospital] = useState(SEED_USERS);
  const [hospitalId, setHospitalId] = useState(null);
  const [deptId, setDeptId] = useState(null);
  const [showUsers, setShowUsers] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [toast, setToast] = useState(null);

  // ---- live-backend state (only touched when session.live is true) ----
  const [liveHospitals, setLiveHospitals] = useState([]);
  const [liveDetail, setLiveDetail] = useState(null); // assembled {id, name, country, residency, departments:[{id,name,cases,trend}]}
  const [liveLoading, setLiveLoading] = useState(false);
  const [liveError, setLiveError] = useState(null);
  const [liveUsers, setLiveUsers] = useState([]);

  const authHeaders = (token) => ({ Authorization: `Bearer ${token}` });

  function caseToBackendPayload(c) {
    return {
      patient_ref: c.id,
      patient_name: c.patientName,
      patient_dob: c.dob,
      patient_gender: c.gender,
      patient_phone: c.phone,
      surgeon: c.surgeon,
      procedure_name: c.procedure,
      urgency_tier: c.urgency,
      status: c.status.toLowerCase(),
      waitlist_date: c.waitlistDate instanceof Date ? isoDate(c.waitlistDate) : c.waitlistDate,
      scheduled_date: c.scheduledDate || null,
    };
  }

  function adaptLiveCase(c) {
    const waitlistDate = new Date(c.waitlist_date);
    const waitDays = Math.max(0, Math.round((TODAY - waitlistDate) / 86400000));
    const statusMap = { waitlisted: "Waitlisted", scheduled: "Scheduled", completed: "Completed", cancelled: "Cancelled" };
    return {
      id: c.patient_ref,
      dbId: c.id,
      patientName: c.patient_name,
      dob: c.patient_dob,
      gender: c.patient_gender,
      phone: c.patient_phone,
      procedure: c.procedure_name,
      surgeon: c.surgeon,
      urgency: c.urgency_tier,
      waitDays,
      waitlistDate,
      status: statusMap[c.status] || c.status,
      scheduledDate: c.scheduled_date || null,
    };
  }

  async function fetchLiveHospitals() {
    if (!session?.live) return;
    try {
      const res = await fetch(`${API_BASE}/hospitals`, { headers: authHeaders(session.token) });
      const data = await res.json();
      if (res.ok) setLiveHospitals(data);
    } catch {
      setLiveError(`Could not reach ${API_BASE}. Is the backend still running?`);
    }
  }

  async function fetchLiveHospitalDetail(hId) {
    if (!session?.live) return;
    setLiveLoading(true);
    setLiveError(null);
    try {
      const meta = liveHospitals.find((h) => h.id === hId);
      const deptsRes = await fetch(`${API_BASE}/hospitals/${hId}/departments`, { headers: authHeaders(session.token) });
      const depts = await deptsRes.json();
      if (!deptsRes.ok) throw new Error(depts.error || "Could not load departments");

      const departments = [];
      let thinHistoryNote = false;
      for (const d of depts) {
        // The aggregate summary never touches patient-identifying columns,
        // so it's fetched unconditionally — it works whether or not the
        // case-level fetch below succeeds, which is exactly what makes it
        // safe for aggregate-scope roles at residency-required hospitals.
        const summaryRes = await fetch(`${API_BASE}/departments/${d.id}/backlog-summary`, { headers: authHeaders(session.token) });
        const summary = await summaryRes.json();

        const trend = summary.snapshot_history.length
          ? summary.snapshot_history.map((s) => ({
              month: new Date(s.snapshot_date).toLocaleDateString("en-GB", { day: "numeric", month: "short" }),
              backlog: s.backlog_count,
            }))
          : [{ month: "now", backlog: summary.backlog_count }];
        if (summary.snapshot_count < 2) thinHistoryNote = true;

        const liveStats = {
          backlog: summary.backlog_count,
          avgWait: summary.avg_wait_days,
          p90: summary.p90_wait_days,
          overdue: summary.overdue_p1_count,
          trendDir: trend.length > 1 ? trend[trend.length - 1].backlog - trend[0].backlog : 0,
        };

        const casesRes = await fetch(`${API_BASE}/departments/${d.id}/cases`, { headers: authHeaders(session.token) });
        const casesData = await casesRes.json();
        const cases = casesRes.ok ? casesData.map(adaptLiveCase) : [];

        departments.push({
          id: d.id,
          name: d.name,
          cases,
          trend,
          liveStats,
          orUtil: summary.or_utilization_pct,
          blockedReason: casesRes.ok ? null : casesData,
        });
      }

      setLiveDetail({
        id: hId,
        name: meta?.name || "Hospital",
        country: meta?.country || "",
        residency: meta?.residency_required ? { jurisdiction: meta.country, law: meta.residency_law, required: true } : null,
        departments,
      });

      if (thinHistoryNote) {
        setLiveError(
          "Trend charts reflect real backlog_snapshot history, but this server has only recorded one or two snapshots so far — " +
          "call POST /api/departments/:id/snapshot periodically (e.g. from cron) to build up a genuine multi-point trend over time."
        );
      }
    } catch (err) {
      setLiveError(err.message || "Could not load hospital data");
      setLiveDetail(null);
    }
    setLiveLoading(false);
  }

  useEffect(() => {
    if (session?.live && !hospitalId) fetchLiveHospitals();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [session?.live, hospitalId]);

  useEffect(() => {
    if (session?.live && hospitalId) fetchLiveHospitalDetail(hospitalId);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [session?.live, hospitalId, liveHospitals.length]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const result = await window.storage.get("session", false);
        if (!cancelled && result?.value) {
          const restored = JSON.parse(result.value);
          setSession(restored);
          if (restored.hospitalId) setHospitalId(restored.hospitalId);
          if (restored.deptId) setDeptId(restored.deptId);
        }
      } catch {
        // no persisted session — normal on first visit or if storage is unavailable
      } finally {
        if (!cancelled) setRestoringSession(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const login = async (s) => {
    setSession(s);
    if (s.hospitalId) setHospitalId(s.hospitalId);
    if (s.deptId) setDeptId(s.deptId);
    try {
      await window.storage.set("session", JSON.stringify(s), false);
    } catch {
      // session still works for this tab even if it couldn't be persisted
    }
  };

  if (restoringSession) {
    return (
      <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <style>{FONTS}</style>
        <Activity size={20} color={C.textFaint} />
      </div>
    );
  }

  if (!session) {
    return <LoginScreen usersByHospital={usersByHospital} onLogin={login} />;
  }

  const roleDef = ROLES.find((r) => r.id === session.role);
  const perms = roleDef.permissions;
  const readOnly = !perms.editSchedule && !perms.editUrgency;
  const AGGREGATE_LEVELS = ["global", "region", "country", "state", "district"];
  const canGoGlobal = AGGREGATE_LEVELS.includes(roleDef.level);
  const canGoHospital = roleDef.level !== "department";
  const canViewCaseLevel = !AGGREGATE_LEVELS.includes(roleDef.level);

  const visibleHospitals = session.live
    ? liveHospitals
    : hospitals.filter(
        (h) =>
          (!session.region || h.region === session.region) &&
          (!session.country || h.country === session.country) &&
          (!session.state || h.state === session.state) &&
          (!session.district || h.district === session.district)
      );

  const hospital = session.live ? liveDetail : hospitals.find((h) => h.id === hospitalId) || null;
  const dept = hospital?.departments.find((d) => d.id === deptId) || null;

  const currentUserId = session.live
    ? session.userId
    : hospital
    ? (usersByHospital[hospital.id] || []).find(
        (u) => u.role === session.role && (session.role !== "dept_head" || u.deptId === session.deptId)
      )?.id
    : null;

  const signOut = () => {
    setSession(null);
    setHospitalId(null);
    setDeptId(null);
    try { window.storage.delete("session", false).catch(() => {}); } catch { /* window.storage isn't available in a published page — sign-out still works, it just doesn't clear a persisted session that was never set in the first place */ }
  };

  async function fetchLiveUsers() {
    if (!session?.live || !hospitalId) return;
    try {
      const res = await fetch(`${API_BASE}/hospitals/${hospitalId}/users`, { headers: authHeaders(session.token) });
      const data = await res.json();
      if (res.ok) setLiveUsers(data);
    } catch {
      setToast("Could not load users from the live backend");
      setTimeout(() => setToast(null), 2500);
    }
  }

  const addUser = async (user) => {
    if (session.live) {
      try {
        const res = await fetch(`${API_BASE}/hospitals/${hospitalId}/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders(session.token) },
          body: JSON.stringify({ name: user.name, email: user.email, role: user.role, department_id: user.deptId || null }),
        });
        const data = await res.json();
        if (!res.ok) {
          setToast(data.error || "Could not add user");
          setTimeout(() => setToast(null), 2500);
          return;
        }
        await fetchLiveUsers();
        setToast(`${user.name} added — temporary password: ${data.temporary_password}`);
        setTimeout(() => setToast(null), 4000);
      } catch {
        setToast("Could not reach the live backend");
        setTimeout(() => setToast(null), 2500);
      }
      return;
    }

    setUsersByHospital((prev) => ({ ...prev, [hospitalId]: [...prev[hospitalId], user] }));
    setToast(`${user.name} added`);
    setTimeout(() => setToast(null), 2200);
  };

  const removeUser = async (userId) => {
    if (userId === currentUserId) return;

    if (session.live) {
      try {
        const res = await fetch(`${API_BASE}/users/${userId}`, { method: "DELETE", headers: authHeaders(session.token) });
        const data = await res.json();
        if (!res.ok) {
          setToast(data.error || "Could not remove user");
          setTimeout(() => setToast(null), 2500);
          return;
        }
        await fetchLiveUsers();
      } catch {
        setToast("Could not reach the live backend");
        setTimeout(() => setToast(null), 2500);
      }
      return;
    }

    setUsersByHospital((prev) => ({ ...prev, [hospitalId]: prev[hospitalId].filter((u) => u.id !== userId) }));
  };

  const importCases = async (byDept, count) => {
    if (session.live) {
      try {
        for (const [deptIdArg, cases] of Object.entries(byDept)) {
          const res = await fetch(`${API_BASE}/departments/${deptIdArg}/cases`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders(session.token) },
            body: JSON.stringify({ cases: cases.map(caseToBackendPayload) }),
          });
          const data = await res.json();
          if (!res.ok) {
            setToast(data.error || "Import failed");
            setTimeout(() => setToast(null), 2500);
            return;
          }
        }
        await fetchLiveHospitalDetail(hospitalId);
        setShowImport(false);
        setToast(`${count} case${count !== 1 ? "s" : ""} imported`);
        setTimeout(() => setToast(null), 2200);
      } catch {
        setToast("Could not reach the live backend");
        setTimeout(() => setToast(null), 2500);
      }
      return;
    }

    setHospitals((prev) =>
      prev.map((h) =>
        h.id !== hospitalId
          ? h
          : {
              ...h,
              departments: h.departments.map((d) =>
                byDept[d.id] ? { ...d, cases: [...d.cases, ...byDept[d.id]] } : d
              ),
            }
      )
    );
    setShowImport(false);
    setToast(`${count} case${count !== 1 ? "s" : ""} imported`);
    setTimeout(() => setToast(null), 2200);
  };

  const updateCase = async (deptIdArg, caseId, patch) => {
    if (session.live) {
      const targetDept = liveDetail?.departments.find((d) => d.id === deptIdArg);
      const targetCase = targetDept?.cases.find((c) => c.id === caseId);
      if (!targetCase) return;

      const body = {};
      if (patch.urgency !== undefined) {
        body.urgency_tier = patch.urgency;
        if (patch.downgradeReason) body.reason = patch.downgradeReason;
      }
      if (patch.surgeon !== undefined) body.surgeon = patch.surgeon;
      if (patch.status !== undefined) body.status = patch.status.toLowerCase();
      if (patch.scheduledDate !== undefined) body.scheduled_date = patch.scheduledDate;

      try {
        const res = await fetch(`${API_BASE}/cases/${targetCase.dbId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json", ...authHeaders(session.token) },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          setToast(data.error || "Update failed");
          setTimeout(() => setToast(null), 2500);
          return;
        }
        await fetchLiveHospitalDetail(hospitalId); // reload from the server so the UI reflects what was actually persisted, not an optimistic guess
        setToast(`${caseId} updated`);
        setTimeout(() => setToast(null), 2200);
      } catch {
        setToast("Could not reach the live backend");
        setTimeout(() => setToast(null), 2500);
      }
      return;
    }

    setHospitals((prev) =>
      prev.map((h) =>
        h.id !== hospitalId
          ? h
          : {
              ...h,
              departments: h.departments.map((d) =>
                d.id !== deptIdArg
                  ? d
                  : { ...d, cases: d.cases.map((c) => (c.id !== caseId ? c : { ...c, ...patch })) }
              ),
            }
      )
    );
    setToast(`${caseId} updated`);
    setTimeout(() => setToast(null), 2200);
  };

  return (
    <div style={{ minHeight: "100vh", background: C.bg }}>
      <style>{FONTS}</style>
      <div className="max-w-4xl mx-auto px-6 pt-5">
        <div className="flex items-center justify-between mb-4 pb-3" style={{ borderBottom: `1px solid ${C.border}` }}>
          <div className="text-xs" style={{ color: C.textFaint, fontFamily: "Inter" }}>
            Signed in as <span style={{ color: C.textDim, fontWeight: 500 }}>{roleDef.label}</span>
            {session.live && <Pill bg={C.accentDim} fg={C.accent}>Live backend</Pill>}
            {!session.live && session.region && <span> · {session.region}</span>}
            {!session.live && session.country && <span> · {session.country}</span>}
            {!session.live && session.state && <span> · {session.state}</span>}
            {!session.live && session.district && <span> · {session.district}</span>}
            {!session.live && session.hospitalId && <span> · {HOSPITALS.find((h) => h.id === session.hospitalId)?.name}</span>}
            {!session.live && session.deptId && <span> · {HOSPITALS.find((h) => h.id === session.hospitalId)?.departments.find((d) => d.id === session.deptId)?.name}</span>}
            {session.live && hospital && <span> · {hospital.name}</span>}
            {session.live && dept && <span> · {dept.name}</span>}
            {readOnly && <span> · read-only</span>}
          </div>
          <div className="flex items-center gap-2">
            {perms.editSchedule && hospital && !showUsers && !showImport && (
              <button
                onClick={() => setShowImport(true)}
                className="flex items-center gap-1 text-xs px-3 py-1 rounded-lg"
                style={{ background: C.surface2, color: C.textDim, border: `1px solid ${C.border}`, fontFamily: "Inter", cursor: "pointer" }}
              >
                <Upload size={12} /> Import cases
              </button>
            )}
            {perms.manageUsers && hospital && !showUsers && !showImport && (
              <button
                onClick={() => { setShowUsers(true); if (session.live) fetchLiveUsers(); }}
                className="flex items-center gap-1 text-xs px-3 py-1 rounded-lg"
                style={{ background: C.surface2, color: C.textDim, border: `1px solid ${C.border}`, fontFamily: "Inter", cursor: "pointer" }}
              >
                <Users size={12} /> Manage users
              </button>
            )}
            <button
              onClick={signOut}
              className="text-xs px-3 py-1 rounded-lg"
              style={{ background: C.surface2, color: C.textDim, border: `1px solid ${C.border}`, fontFamily: "Inter", cursor: "pointer" }}
            >
              Sign out
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-4xl mx-auto px-6 pb-8">
        {session.live && liveLoading ? (
          <div className="text-sm py-12 text-center" style={{ color: C.textFaint, fontFamily: "Inter" }}>
            Loading from live backend…
          </div>
        ) : session.live && liveError && !hospital ? (
          <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.danger}` }}>
            <div className="text-sm" style={{ color: C.text, fontFamily: "Inter" }}>{liveError}</div>
          </div>
        ) : showUsers && hospital ? (
          <UserManagementView
            hospital={hospital}
            users={session.live ? liveUsers : usersByHospital[hospital.id] || []}
            currentUserId={currentUserId}
            onAdd={addUser}
            onRemove={removeUser}
            onBack={() => setShowUsers(false)}
          />
        ) : showImport && hospital ? (
          <CsvImportView
            hospital={hospital}
            restrictedDeptId={roleDef.level === "department" ? session.deptId : null}
            onCommit={importCases}
            onBack={() => setShowImport(false)}
          />
        ) : (
          <>
            {session.live && liveError && hospital && (
              <div className="rounded-xl p-3 mb-4 text-xs" style={{ background: C.surface, border: `1px solid ${C.border}`, color: C.textDim, fontFamily: "Inter", lineHeight: 1.5 }}>
                {liveError}
              </div>
            )}
            {!hospital && <Overview hospitals={visibleHospitals} lockedLabel={session.district || session.state || session.country || session.region} onSelectHospital={setHospitalId} />}
            {hospital && !dept && (
              <HospitalView hospital={hospital} onBack={canGoGlobal ? () => setHospitalId(null) : null} onSelectDept={setDeptId} canViewCaseLevel={canViewCaseLevel} />
            )}
            {hospital && dept && (
              <DepartmentView
                hospital={hospital}
                dept={dept}
                onBackHospital={canGoHospital ? () => setDeptId(null) : null}
                onUpdateCase={updateCase}
                readOnly={readOnly}
                perms={perms}
              />
            )}
          </>
        )}
      </div>

      {toast && (
        <div
          className="fixed left-1/2 text-sm px-4 py-2 rounded-lg"
          style={{
            bottom: 24, transform: "translateX(-50%)", background: C.surface2,
            border: `1px solid ${C.border}`, color: C.text, fontFamily: "Inter",
          }}
        >
          {toast}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
