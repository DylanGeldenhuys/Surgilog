# PLACEHOLDER production environment. No secrets.
# projectId is config/prod.json, also the prod alias in .firebaserc.
# FICTIONAL_SEEDING=false is enforced twice: prod API startup refuses any other value,
# and seed/review-setup scripts refuse to run when this flag is false.
APP_ENV: prod
FIREBASE_PROJECT_ID: surgilog-production
ALLOWED_ORIGINS: https://surgilog-production.web.app,https://surgilog-production.firebaseapp.com,https://surgilog.app
FICTIONAL_SEEDING: "false"
