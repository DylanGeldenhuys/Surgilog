# PLACEHOLDER production environment. No secrets.
# projectId is config/prod.json, also the prod alias in .firebaserc.
# Fictional seeding is review-only and stays off. Prod startup refuses any other value.
APP_ENV: prod
FIREBASE_PROJECT_ID: surgilog-prod
ALLOWED_ORIGINS: https://surgilog-prod.web.app,https://surgilog-prod.firebaseapp.com
FICTIONAL_SEEDING: "false"
