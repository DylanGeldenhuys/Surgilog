name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-production to release signed-off main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API then Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys run only from signed-off main. This ref is ${{ github.ref }}. Nothing was deployed."
          exit 1

      - name: Require the production confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy-production" ]; then
            echo "::error::Refusing production deploy. Re-run from main and set confirm to deploy-production. Nothing was deployed."
            exit 1
          fi

      - name: Check production deploy secrets
        id: secret
        env:
          GCP_SA: ${{ secrets.PROD_GCP_SA_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: |
          if [ -z "$GCP_SA" ] || [ -z "$FIREBASE_SA" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping production deploy. The production environment secrets PROD_GCP_SA_KEY and FIREBASE_SERVICE_ACCOUNT_PROD are not both set. Nothing was deployed. See docs/environments.md."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.secret.outputs.present == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.secret.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.secret.outputs.present == 'true'
        run: npm ci

      - name: Guard the production target
        id: target
        if: steps.secret.outputs.present == 'true'
        run: npx tsx scripts/guard-deploy.ts --target prod --confirm-prod --github-output

      - name: Authenticate the deploy identity
        if: steps.secret.outputs.present == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.PROD_GCP_SA_KEY }}
          project_id: ${{ steps.target.outputs.project_id }}

      - name: Set up gcloud
        if: steps.secret.outputs.present == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ steps.target.outputs.project_id }}

      - name: Deploy the API
        if: steps.secret.outputs.present == 'true'
        env:
          SERVICE: ${{ steps.target.outputs.service }}
          REGION: ${{ steps.target.outputs.region }}
          RUNTIME_SA: ${{ steps.target.outputs.runtime_service_account }}
          BUILD_SA: ${{ steps.target.outputs.build_service_account }}
          PROJECT: ${{ steps.target.outputs.project_id }}
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --source=. \
            --region="${REGION}" \
            --service-account="${RUNTIME_SA}" \
            --build-service-account="${BUILD_SA}" \
            --env-vars-file=config/prod-api.yaml \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=20 \
            --timeout=30s \
            --cpu-throttling \
            --no-invoker-iam-check \
            --project="${PROJECT}" \
            --quiet

      - name: Read the API URL
        id: api
        if: steps.secret.outputs.present == 'true'
        env:
          SERVICE: ${{ steps.target.outputs.service }}
          REGION: ${{ steps.target.outputs.region }}
          PROJECT: ${{ steps.target.outputs.project_id }}
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" --region="${REGION}" --project="${PROJECT}" --format='value(status.url)')"
          case "$url" in
            https://*.run.app) ;;
            *) echo "::error::Cloud Run did not return an HTTPS run.app origin. Hosting was not deployed."; exit 1 ;;
          esac
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Build the production web app
        if: steps.secret.outputs.present == 'true'
        env:
          PROD_API_URL: ${{ steps.api.outputs.url }}
        run: npm run build:prod -- --api-url "$PROD_API_URL"

      - name: Write the hosting-only Firebase config
        if: steps.secret.outputs.present == 'true'
        run: npx tsx scripts/write-prod-firebase-json.ts --overwrite-firebase-json --confirm-prod

      - name: Deploy Hosting
        if: steps.secret.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        env:
          CONFIRM_PROD: "yes"
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          projectId: ${{ steps.target.outputs.project_id }}
          channelId: live
          firebaseToolsVersion: 15.32.1
          disableComment: "true"
